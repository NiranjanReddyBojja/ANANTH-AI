<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: http://localhost:* https://*; frame-src 'self' http://localhost:* https://*;">
  <title>AuraBrowser - AI-Powered Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Main Application Container -->
  <div id="app">
    
    <!-- Top Navigation Bar -->
    <header class="top-bar">
      <div class="nav-controls">
        <button id="btn-back" class="nav-btn" title="Go Back">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
          </svg>
        </button>
        <button id="btn-forward" class="nav-btn" title="Go Forward">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/>
          </svg>
        </button>
        <button id="btn-refresh" class="nav-btn" title="Refresh">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>

      <div class="url-bar-container">
        <input 
          type="text" 
          id="url-input" 
          class="url-input" 
          placeholder="Enter URL or search..." 
          autocomplete="off"
          spellcheck="false"
        />
        <button id="btn-go" class="go-btn" title="Go">
          <svg viewBox="0 0 24 24" width="18" height="18">
            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
          </svg>
        </button>
      </div>

      <div class="ai-controls">
        <button id="btn-sidepanel-toggle" class="sidepanel-btn active" title="Toggle AI Sidepanel">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <path fill="currentColor" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zM7 15h2v2H7zm0-4h2v2H7zm0-4h2v2H7zm4 8h6v2h-6zm0-4h6v2h-6zm0-4h6v2h-6z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- WebView for rendering web pages -->
      <webview 
        id="webview" 
        class="webview"
        src="about:blank"
        allowpopups="false"
        webpreferences="javascript=yes,webSecurity=true"
      ></webview>

      <!-- AI Sidepanel -->
      <aside id="sidepanel" class="sidepanel open">
        <div class="sidepanel-header">
          <h2 class="sidepanel-title">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
            </svg>
            AI Assistant
          </h2>
          <button id="btn-close-sidepanel" class="close-sidepanel-btn" title="Close Sidepanel">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
            </svg>
          </button>
        </div>

        <!-- Quick Actions -->
        <div class="quick-actions">
          <button id="btn-analyze-page" class="action-btn primary" title="Analyze Current Page">
            <svg viewBox="0 0 24 24" width="18" height="18">
              <path fill="currentColor" d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            Analyze Page
          </button>
          <button id="btn-summarize" class="action-btn" title="Summarize Content">
            Summarize
          </button>
          <button id="btn-contradictions" class="action-btn" title="Find Contradictions">
            Find Issues
          </button>
          <button id="btn-explain" class="action-btn" title="Explain Technical Terms">
            Explain
          </button>
        </div>

        <!-- Chat History -->
        <div id="chat-history" class="chat-history">
          <div class="welcome-message">
            <p>👋 Welcome to AuraBrowser!</p>
            <p>I'm your AI assistant. I can help you:</p>
            <ul>
              <li>Analyze and summarize web pages</li>
              <li>Find contradictions or issues</li>
              <li>Explain technical concepts</li>
              <li>Answer questions about content</li>
            </ul>
            <p>Click "Analyze Page" to get started!</p>
          </div>
        </div>

        <!-- Chat Input -->
        <div class="chat-input-container">
          <textarea 
            id="chat-input" 
            class="chat-input" 
            placeholder="Ask me anything..." 
            rows="2"
            spellcheck="true"
          ></textarea>
          <button id="btn-send" class="send-btn" title="Send Message">
            <svg viewBox="0 0 24 24" width="20" height="20">
              <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
          </button>
        </div>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="loading-indicator hidden">
          <div class="spinner"></div>
          <span>AI is thinking...</span>
        </div>
      </aside>
    </main>

    <!-- Status Bar -->
    <footer class="status-bar">
      <span id="status-text">Ready</span>
      <span id="connection-status" class="status-indicator connected">●</span>
    </footer>

  </div>

  <script src="renderer.js"></script>
</body>
</html>
