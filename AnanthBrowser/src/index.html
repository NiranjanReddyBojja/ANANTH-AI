<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https: http:;">
  <title>Ananth Browser</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="sprite" aria-hidden="true">
    <symbol id="i-back" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></symbol>
    <symbol id="i-forward" viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></symbol>
    <symbol id="i-reload" viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0012 4a8 8 0 108 8h-2a6 6 0 11-1.76-4.24L13 11h7V4l-2.35 2.35z"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M12 8a2 2 0 100-4 2 2 0 000 4zm0 2a2 2 0 100 4 2 2 0 000-4zm0 6a2 2 0 100 4 2 2 0 000-4z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M22 9.24l-7.19-.62L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21 12 17.27 18.18 21l-1.63-7.03L22 9.24zM12 15.4l-3.76 2.27 1-4.28-3.32-2.88 4.38-.38L12 6.1l1.71 4.04 4.38.38-3.32 2.88 1 4.28L12 15.4z"/></symbol>
    <symbol id="i-star-filled" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M18 8h-1V6A5 5 0 007 6v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zM9 6a3 3 0 016 0v2H9V6zm9 14H6V10h12v10zm-6-3a2 2 0 100-4 2 2 0 000 4z"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0a4.5 4.5 0 110-9 4.5 4.5 0 010 9z"/></symbol>
    <symbol id="i-globe" viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm6.93 6h-2.95a15.65 15.65 0 00-1.38-3.56A8.03 8.03 0 0118.93 8zM12 4.04c.83 1.2 1.48 2.53 1.91 3.96h-3.82c.43-1.43 1.08-2.76 1.91-3.96zM4.26 14a7.82 7.82 0 010-4h3.38a16.5 16.5 0 000 4H4.26zm.81 2h2.95c.32 1.25.78 2.45 1.38 3.56A8 8 0 015.07 16zm2.95-8H5.07a8 8 0 014.33-3.56A15.65 15.65 0 008.02 8zM12 19.96A14.1 14.1 0 0110.09 16h3.82A14.1 14.1 0 0112 19.96zM14.34 14H9.66a14.7 14.7 0 010-4h4.68a14.7 14.7 0 010 4zm.26 5.56c.6-1.11 1.06-2.31 1.38-3.56h2.95a8.03 8.03 0 01-4.33 3.56zM16.36 14a16.5 16.5 0 000-4h3.38a7.82 7.82 0 010 4h-3.38z"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M13 3a9 9 0 00-9 9H1l3.89 3.89.07.14L9 12H6a7 7 0 112.05 4.95l-1.42 1.42A9 9 0 1013 3zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></symbol>
    <symbol id="i-volume" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0014 7.97v8.05A4.47 4.47 0 0016.5 12zM14 3.23v2.06a7 7 0 010 13.42v2.06a9 9 0 000-17.54z"/></symbol>
    <symbol id="i-muted" viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0a6.9 6.9 0 01-.54 2.64l1.51 1.51A8.87 8.87 0 0021 12a9 9 0 00-7-8.77v2.06A7 7 0 0119 12zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.96 8.96 0 003.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M7.41 15.41L12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 24 24"><path d="M10 4H4a2 2 0 00-2 2v12a2 2 0 002 2h16a2 2 0 002-2V8a2 2 0 00-2-2h-8l-2-2z"/></symbol>
  </svg>

  <div id="app">
    <!-- Tab strip -->
    <div id="tabstrip" class="tabstrip">
      <div id="tabs" class="tabs" role="tablist"></div>
      <button id="btn-new-tab" class="icon-btn new-tab-btn" title="New tab"><svg><use href="#i-plus"/></svg></button>
      <div class="tabstrip-drag"></div>
    </div>

    <!-- Toolbar -->
    <div id="toolbar" class="toolbar">
      <button id="btn-back" class="icon-btn" title="Back" disabled><svg><use href="#i-back"/></svg></button>
      <button id="btn-forward" class="icon-btn" title="Forward" disabled><svg><use href="#i-forward"/></svg></button>
      <button id="btn-reload" class="icon-btn" title="Reload"><svg><use id="reload-icon" href="#i-reload"/></svg></button>

      <div id="omnibox" class="omnibox">
        <span id="site-icon" class="site-icon" title=""><svg><use id="site-icon-use" href="#i-search"/></svg></span>
        <input id="url-input" class="url-input" type="text" placeholder="Search or type a URL"
               autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Address and search bar">
        <button id="zoom-badge" class="zoom-badge" title="Reset zoom" hidden></button>
        <button id="btn-star" class="icon-btn small" title="Bookmark this tab"><svg><use id="star-icon" href="#i-star"/></svg></button>
        <div id="suggestions" class="suggestions" role="listbox" hidden></div>
      </div>

      <button id="btn-downloads" class="icon-btn" title="Downloads" hidden>
        <svg><use href="#i-download"/></svg>
        <span id="downloads-progress" class="downloads-progress"></span>
      </button>
      <button id="btn-menu" class="icon-btn" title="Menu"><svg><use href="#i-menu"/></svg></button>

      <div id="progress" class="progress"></div>
    </div>

    <!-- Bookmarks bar -->
    <div id="bookmarks-bar" class="bookmarks-bar" hidden></div>

    <!-- Content -->
    <div id="content" class="content">
      <div id="webviews" class="webviews"></div>

      <div id="ntp" class="page-overlay ntp" hidden>
        <div class="ntp-inner">
          <h1 class="ntp-logo">Ananth Browser</h1>
          <div class="ntp-search">
            <svg><use href="#i-search"/></svg>
            <input id="ntp-input" type="text" placeholder="Search the web or type a URL"
                   autocomplete="off" spellcheck="false" aria-label="Search the web">
          </div>
          <div id="ntp-tiles" class="ntp-tiles"></div>
        </div>
      </div>

      <div id="error-page" class="page-overlay error-page" hidden>
        <div class="error-inner">
          <svg class="error-icon"><use href="#i-warning"/></svg>
          <h1 id="error-title"></h1>
          <p id="error-detail"></p>
          <p id="error-code" class="error-code"></p>
          <button id="btn-error-reload" class="primary-btn">Reload</button>
        </div>
      </div>

      <div id="findbar" class="findbar" hidden>
        <input id="find-input" type="text" placeholder="Find in page" spellcheck="false" aria-label="Find in page">
        <span id="find-count" class="find-count"></span>
        <button id="btn-find-prev" class="icon-btn small" title="Previous"><svg><use href="#i-up"/></svg></button>
        <button id="btn-find-next" class="icon-btn small" title="Next"><svg><use href="#i-down"/></svg></button>
        <button id="btn-find-close" class="icon-btn small" title="Close"><svg><use href="#i-close"/></svg></button>
      </div>

      <div id="status-bubble" class="status-bubble" hidden></div>

      <aside id="panel" class="panel" hidden>
        <header class="panel-header">
          <div class="panel-tabs">
            <button class="panel-tab" data-panel="history">History</button>
            <button class="panel-tab" data-panel="bookmarks">Bookmarks</button>
            <button class="panel-tab" data-panel="downloads">Downloads</button>
          </div>
          <button id="btn-panel-close" class="icon-btn small" title="Close"><svg><use href="#i-close"/></svg></button>
        </header>
        <div id="panel-tools" class="panel-tools">
          <input id="panel-search" type="text" placeholder="Search history" spellcheck="false" aria-label="Search history">
          <button id="btn-clear-data" class="text-btn">Clear…</button>
        </div>
        <div id="panel-body" class="panel-body"></div>
      </aside>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
